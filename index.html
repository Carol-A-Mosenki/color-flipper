<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
        }

        button{
            margin: 20px;
            font-size: 30px;
            border-radius: 30px;
            padding: 20px;
        }

        #yellow{
            background-color: yellow;
        }

         #pink{
            background-color: pink;
        }

         #purple{
            background-color: purple;
        }



    </style>
</head>
<body>
    <h1>Color Flipper</h1>
    <p>Click the button to change the color! :)</p>
    <button id="yellow" onclick="setColor('yellow')">Yellow</button>
    <button id="pink" onclick="setColor('pink')">Pink</button>
    <button id="purple" onclick="setColor('purple')">Purple</button>
    <button id="random" onclick="randomColor()">Random</button>


    <script src="script.js"></script>
</body>
</html>
